[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eurotour-agent"
version = "0.1.0"
description = "Personal Europe travel and live music planning agent."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.32",
  "tzdata>=2025.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
eurotour-agent = "eurotour_agent.scheduler:app"

[tool.setuptools.packages.find]
where = ["src"]
